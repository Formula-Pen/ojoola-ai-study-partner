<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">

  <title>Ojoola AI Study Partner</title>

  <!-- IMPORTANT: load core first -->
  <script>
    window.OJOOLA_NO_GATE = 1;
  </script>
  <script src="ojoola-core.js"></script>

  <style>
    :root {
      --blue: #2563eb;
      --blue-dark: #1d4ed8;
      --blue-light: #3b82f6;
      --text: #172033;
      --muted: #64748b;
      --border: #dbe3ef;
      --bg: #f5f8fc;
      --card: #ffffff;
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background:
        radial-gradient(
          circle at top,
          rgba(59, 130, 246, 0.10),
          transparent 38%
        ),
        var(--bg);

      color: var(--text);

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 22px 16px;
    }

    .page {
      width: 100%;
      max-width: 430px;
    }

    .card {
      background: var(--card);
      border: 1px solid rgba(219, 227, 239, 0.9);
      border-radius: var(--radius);

      padding: 30px 24px 25px;

      box-shadow:
        0 18px 50px rgba(15, 23, 42, 0.08),
        0 3px 12px rgba(37, 99, 235, 0.05);
    }

    .brand {
      text-align: center;
      margin-bottom: 22px;
    }

    .logo {
      width: 72px;
      height: 72px;
      object-fit: contain;
      display: block;
      margin: 0 auto 12px;
      border-radius: 18px;
    }

    .brand h1 {
      margin: 0;
      font-size: 23px;
      line-height: 1.2;
      font-weight: 750;
      letter-spacing: -0.3px;
    }

    .brand p {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;

      background: #eef3f9;
      border-radius: 12px;
      padding: 4px;

      margin-bottom: 23px;
    }

    .tab {
      border: 0;
      background: transparent;
      color: #64748b;

      padding: 11px 8px;
      border-radius: 9px;

      font-size: 14px;
      font-weight: 650;

      cursor: pointer;
      transition: all 0.18s ease;
    }

    .tab.active {
      background: #ffffff;
      color: var(--blue);

      box-shadow:
        0 2px 8px rgba(15, 23, 42, 0.08);
    }

    .form {
      display: none;
    }

    .form.active {
      display: block;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;

      font-size: 13px;
      font-weight: 650;

      color: #334155;

      margin-bottom: 7px;
    }

    .input-wrap {
      position: relative;
    }

    input {
      width: 100%;
      height: 48px;

      border: 1px solid var(--border);
      border-radius: 11px;

      background: #ffffff;
      color: var(--text);

      padding: 0 14px;

      font-size: 15px;
      outline: none;

      transition:
        border-color 0.16s ease,
        box-shadow 0.16s ease,
        background 0.16s ease;
    }

    input.password-input {
      padding-right: 50px;
    }

    input::placeholder {
      color: #94a3b8;
    }

    input:focus {
      border-color: var(--blue-light);

      box-shadow:
        0 0 0 4px rgba(37, 99, 235, 0.10);

      background: #ffffff;
    }

    .password-eye {
      position: absolute;

      right: 5px;
      top: 50%;

      transform: translateY(-50%);

      width: 40px;
      height: 40px;

      border: 0;
      background: transparent;

      color: #64748b;

      border-radius: 9px;

      display: flex;
      align-items: center;
      justify-content: center;

      cursor: pointer;

      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    .password-eye:hover {
      background: #f1f5f9;
      color: var(--blue);
    }

    .password-eye:active {
      background: #e8eef8;
    }

    .password-eye svg {
      width: 20px;
      height: 20px;
      pointer-events: none;
    }

    .forgot-row {
      text-align: right;

      margin-top: -7px;
      margin-bottom: 17px;
    }

    .forgot-link {
      border: 0;
      padding: 3px 0;

      background: transparent;

      color: var(--blue);

      font-size: 13px;
      font-weight: 600;

      cursor: pointer;
    }

    .forgot-link:hover {
      color: var(--blue-dark);
      text-decoration: underline;
    }

    .btn {
      width: 100%;
      min-height: 49px;

      border-radius: 11px;
      border: 0;

      font-size: 15px;
      font-weight: 700;

      cursor: pointer;

      transition:
        transform 0.14s ease,
        box-shadow 0.18s ease,
        filter 0.18s ease;
    }

    /*
      Brighter Create Account / Sign In button
    */
    .btn-primary {
      color: #ffffff;

      background:
        linear-gradient(
          135deg,
          #2563eb 0%,
          #3b82f6 100%
        );

      box-shadow:
        0 7px 20px rgba(37, 99, 235, 0.27),
        inset 0 1px 0 rgba(255, 255, 255, 0.18);
    }

    .btn-primary:hover {
      filter: brightness(1.045);

      box-shadow:
        0 9px 25px rgba(37, 99, 235, 0.34),
        inset 0 1px 0 rgba(255, 255, 255, 0.18);
    }

    .btn-primary:active {
      transform: translateY(1px);

      box-shadow:
        0 4px 13px rgba(37, 99, 235, 0.24);
    }

    .btn-primary:disabled {
      opacity: 0.65;
      cursor: wait;
      transform: none;
    }

    .message {
      display: none;

      margin: 0 0 16px;

      padding: 11px 13px;

      border-radius: 10px;

      font-size: 13px;
      line-height: 1.45;
    }

    .message.show {
      display: block;
    }

    .message.error {
      color: #991b1b;
      background: #fef2f2;
      border: 1px solid #fecaca;
    }

    .message.success {
      color: #166534;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
    }

    .hint {
      color: var(--muted);

      font-size: 12px;
      line-height: 1.5;

      margin-top: 8px;
    }

    .back-link {
      display: block;

      text-align: center;

      margin-top: 16px;

      color: var(--blue);

      font-size: 13px;
      font-weight: 600;

      cursor: pointer;

      border: 0;
      background: transparent;

      width: 100%;
    }

    .footer {
      text-align: center;

      color: #94a3b8;

      font-size: 11px;

      margin-top: 17px;
    }

    @media (max-width: 420px) {
      body {
        padding: 14px;
      }

      .card {
        padding: 25px 19px 22px;
        border-radius: 16px;
      }

      .logo {
        width: 66px;
        height: 66px;
      }

      .brand h1 {
        font-size: 21px;
      }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --card: #111827;
        --text: #f1f5f9;
        --muted: #94a3b8;
        --border: #263449;
      }

      .card {
        border-color: #263449;

        box-shadow:
          0 18px 50px rgba(0, 0, 0, 0.25);
      }

      .tabs {
        background: #1e293b;
      }

      .tab.active {
        background: #111827;
      }

      input {
        background: #0f172a;
        color: #f1f5f9;
        border-color: #334155;
      }

      input:focus {
        background: #0f172a;
      }

      .password-eye:hover {
        background: #1e293b;
      }
    }
  </style>
</head>

<body>

<div class="page">

  <div class="card">

    <!-- BRAND -->
    <div class="brand">

      <img
        class="logo"
        src="icons/icon-192.png"
        alt="Ojoola"
      >

      <h1>Ojoola AI Study Partner</h1>

      <p>
        Learn smarter with your personal AI study partner.
      </p>

    </div>


    <!-- TABS -->
    <div class="tabs">

      <button
        class="tab active"
        id="signInTab"
        type="button"
      >
        Sign in
      </button>

      <button
        class="tab"
        id="createTab"
        type="button"
      >
        Create account
      </button>

    </div>


    <!-- MESSAGE -->
    <div
      id="message"
      class="message"
    ></div>


    <!-- SIGN IN -->
    <form
      id="signInForm"
      class="form active"
    >

      <div class="field">

        <label for="loginIdentifier">
          Username or email
        </label>

        <input
          id="loginIdentifier"
          type="text"
          autocomplete="username"
          placeholder="Enter your username or email"
          required
        >

      </div>


      <div class="field">

        <label for="loginPassword">
          Password
        </label>

        <div class="input-wrap">

          <input
            id="loginPassword"
            class="password-input"
            type="password"
            autocomplete="current-password"
            placeholder="Enter your password"
            required
          >

          <button
            type="button"
            class="password-eye"
            aria-label="Show password"
            data-target="loginPassword"
          ></button>

        </div>

      </div>


      <div class="forgot-row">

        <button
          type="button"
          class="forgot-link"
          id="forgotLink"
        >
          Forgot password?
        </button>

      </div>


      <button
        class="btn btn-primary"
        type="submit"
        id="signInBtn"
      >
        Sign in
      </button>

    </form>


    <!-- CREATE ACCOUNT -->
    <form
      id="createForm"
      class="form"
    >

      <div class="field">

        <label for="firstName">
          First name
        </label>

        <input
          id="firstName"
          type="text"
          autocomplete="given-name"
          placeholder="Enter your first name"
          maxlength="40"
          required
        >

      </div>


      <div class="field">

        <label for="username">
          Username
        </label>

        <input
          id="username"
          type="text"
          autocomplete="username"
          placeholder="Choose a username"
          maxlength="20"
          required
        >

        <div class="hint">
          3–20 letters, numbers or underscores.
        </div>

      </div>


      <div class="field">

        <label for="email">
          Email address
        </label>

        <input
          id="email"
          type="email"
          autocomplete="email"
          placeholder="Enter your email"
          required
        >

      </div>


      <div class="field">

        <label for="createPassword">
          Password
        </label>

        <div class="input-wrap">

          <input
            id="createPassword"
            class="password-input"
            type="password"
            autocomplete="new-password"
            placeholder="Create a password"
            minlength="8"
            required
          >

          <button
            type="button"
            class="password-eye"
            aria-label="Show password"
            data-target="createPassword"
          ></button>

        </div>

        <div class="hint">
          Password must be at least 8 characters.
        </div>

      </div>


      <button
        class="btn btn-primary"
        type="submit"
        id="createBtn"
      >
        Create account
      </button>

    </form>


    <!-- FORGOT PASSWORD -->
    <form
      id="forgotForm"
      class="form"
    >

      <div class="field">

        <label for="resetEmail">
          Registered email
        </label>

        <input
          id="resetEmail"
          type="email"
          autocomplete="email"
          placeholder="Enter the email on your account"
          required
        >

      </div>


      <div
        class="hint"
        style="margin-bottom:17px;"
      >
        If the email belongs to an account, a password-reset
        link will be sent to it.
      </div>


      <button
        class="btn btn-primary"
        type="submit"
        id="resetBtn"
      >
        Send reset link
      </button>


      <button
        type="button"
        class="back-link"
        id="backToSignIn"
      >
        Back to sign in
      </button>

    </form>


    <div class="footer">
      Ojoola AI Study Partner
    </div>

  </div>

</div>


<script>
"use strict";


/* =========================================================
   OJOOLA API
========================================================= */

/*
  ojoola-core.js already contains the correct Worker address:

  https://ojoola.babatundexwale.workers.dev

  We use OjoolaCore.api here instead of relative /api/... URLs.
*/
const API = window.OjoolaCore && window.OjoolaCore.api
  ? window.OjoolaCore.api
  : "https://ojoola.babatundexwale.workers.dev";


/*
  IMPORTANT:
  ojoola-core.js expects the session under:

  ojoola_session

  Therefore we use OjoolaCore.setSession().
*/
function saveSession(token) {
  if (
    window.OjoolaCore &&
    typeof window.OjoolaCore.setSession === "function"
  ) {
    window.OjoolaCore.setSession(token);
  } else {
    localStorage.setItem("ojoola_session", token);
  }
}


/* =========================================================
   ELEMENTS
========================================================= */

const signInTab = document.getElementById("signInTab");
const createTab = document.getElementById("createTab");

const signInForm = document.getElementById("signInForm");
const createForm = document.getElementById("createForm");
const forgotForm = document.getElementById("forgotForm");

const message = document.getElementById("message");

const forgotLink = document.getElementById("forgotLink");
const backToSignIn = document.getElementById("backToSignIn");

const loginIdentifier =
  document.getElementById("loginIdentifier");

const loginPassword =
  document.getElementById("loginPassword");

const firstName =
  document.getElementById("firstName");

const username =
  document.getElementById("username");

const email =
  document.getElementById("email");

const createPassword =
  document.getElementById("createPassword");

const resetEmail =
  document.getElementById("resetEmail");


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(text, type = "error") {

  message.textContent = text;

  message.className =
    "message show " + type;
}


function clearMessage() {

  message.textContent = "";

  message.className = "message";
}


/* =========================================================
   FORM SWITCHING
========================================================= */

function hideForms() {

  signInForm.classList.remove("active");
  createForm.classList.remove("active");
  forgotForm.classList.remove("active");

  signInTab.classList.remove("active");
  createTab.classList.remove("active");
}


function showSignIn() {

  hideForms();

  signInTab.classList.add("active");
  signInForm.classList.add("active");

  clearMessage();
}


function showCreate() {

  hideForms();

  createTab.classList.add("active");
  createForm.classList.add("active");

  clearMessage();
}


function showForgot() {

  hideForms();

  forgotForm.classList.add("active");

  clearMessage();
}


signInTab.addEventListener(
  "click",
  showSignIn
);

createTab.addEventListener(
  "click",
  showCreate
);

forgotLink.addEventListener(
  "click",
  showForgot
);

backToSignIn.addEventListener(
  "click",
  showSignIn
);


/* =========================================================
   PASSWORD EYE
   SHORT TAP = TOGGLE
   LONG PRESS = SHOW WHILE HELD
========================================================= */

function eyeOpenSVG() {

  return `
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path>
      <circle cx="12" cy="12" r="3"></circle>
    </svg>
  `;
}


function eyeClosedSVG() {

  return `
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M3 3l18 18"></path>
      <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
      <path d="M9.9 4.2A10.8 10.8 0 0 1 12 4c6.5 0 10 8 10 8a17.5 17.5 0 0 1-3.2 4.5"></path>
      <path d="M6.6 6.6C3.7 8.6 2 12 2 12s3.5 8 10 8a10.9 10.9 0 0 0 4.2-.9"></path>
    </svg>
  `;
}


function setPasswordVisible(
  input,
  button,
  visible
) {

  input.type =
    visible ? "text" : "password";

  button.innerHTML =
    visible
      ? eyeOpenSVG()
      : eyeClosedSVG();

  button.setAttribute(
    "aria-label",
    visible
      ? "Hide password"
      : "Show password"
  );
}


document
  .querySelectorAll(".password-eye")
  .forEach(button => {

    const input =
      document.getElementById(
        button.dataset.target
      );

    let holdTimer = null;
    let pointerDown = false;
    let holdUsed = false;

    setPasswordVisible(
      input,
      button,
      false
    );


    button.addEventListener(
      "pointerdown",
      event => {

        event.preventDefault();

        pointerDown = true;
        holdUsed = false;

        holdTimer = setTimeout(() => {

          if (!pointerDown) return;

          holdUsed = true;

          setPasswordVisible(
            input,
            button,
            true
          );

        }, 350);
      }
    );


    button.addEventListener(
      "pointerup",
      event => {

        event.preventDefault();

        pointerDown = false;

        if (holdTimer) {
          clearTimeout(holdTimer);
          holdTimer = null;
        }


        /* Long press:
           hide again when released. */
        if (holdUsed) {

          setPasswordVisible(
            input,
            button,
            false
          );

          holdUsed = false;

          return;
        }


        /* Normal tap:
           toggle visibility. */
        setPasswordVisible(
          input,
          button,
          input.type === "password"
        );
      }
    );


    button.addEventListener(
      "pointercancel",
      () => {

        pointerDown = false;

        if (holdTimer) {
          clearTimeout(holdTimer);
          holdTimer = null;
        }

        if (holdUsed) {
          setPasswordVisible(
            input,
            button,
            false
          );
        }

        holdUsed = false;
      }
    );
  });


/* =========================================================
   API HELPER
========================================================= */

async function api(path, options = {}) {

  const response = await fetch(
    API + path,
    {
      ...options,

      headers: {
        "Content-Type": "application/json",
        ...(options.headers || {})
      }
    }
  );


  let data = {};

  try {
    data = await response.json();
  } catch (_) {
    data = {};
  }


  if (!response.ok) {

    let error = data.error;

    if (
      error &&
      typeof error === "object"
    ) {
      error = error.message;
    }

    throw new Error(
      error ||
      "Something went wrong. Please try again."
    );
  }


  return data;
}


/* =========================================================
   SIGN IN
========================================================= */

signInForm.addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    clearMessage();


    const identifier =
      loginIdentifier.value.trim();

    const password =
      loginPassword.value;


    if (!identifier || !password) {

      showMessage(
        "Enter your username/email and password."
      );

      return;
    }


    const button =
      document.getElementById(
        "signInBtn"
      );


    button.disabled = true;
    button.textContent = "Signing in...";


    try {

      const data =
        await api(
          "/api/login",
          {
            method: "POST",

            body: JSON.stringify({
              identifier,
              password
            })
          }
        );


      /*
        THIS IS THE IMPORTANT PART.

        Save the token as ojoola_session,
        because ojoola-core.js reads that key.
      */
      if (data.token) {
        saveSession(data.token);
      }


      if (data.user) {

        localStorage.setItem(
          "ojoola_user",
          JSON.stringify(data.user)
        );
      }


      showMessage(
        "Signed in successfully.",
        "success"
      );


      setTimeout(() => {

        const params =
          new URLSearchParams(
            window.location.search
          );

        const next =
          params.get("next") ||
          "index.html";

        window.location.replace(
          next
        );

      }, 350);

    } catch (error) {

      showMessage(
        error.message
      );

    } finally {

      button.disabled = false;
      button.textContent = "Sign in";
    }
  }
);


/* =========================================================
   CREATE ACCOUNT
========================================================= */

createForm.addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    clearMessage();


    const first =
      firstName.value.trim();

    const user =
      username.value.trim();

    const mail =
      email.value.trim();

    const password =
      createPassword.value;


    if (
      !first ||
      !user ||
      !mail ||
      !password
    ) {

      showMessage(
        "Please complete all fields."
      );

      return;
    }


    if (
      !/^[A-Za-z0-9_]{3,20}$/.test(user)
    ) {

      showMessage(
        "Username must be 3–20 letters, numbers or underscores."
      );

      return;
    }


    if (
      !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)
    ) {

      showMessage(
        "Enter a valid email address."
      );

      return;
    }


    if (password.length < 8) {

      showMessage(
        "Password must be at least 8 characters."
      );

      return;
    }


    const button =
      document.getElementById(
        "createBtn"
      );


    button.disabled = true;
    button.textContent =
      "Creating account...";


    try {

      const data =
        await api(
          "/api/signup",
          {
            method: "POST",

            body: JSON.stringify({
              firstName: first,
              username: user,
              email: mail,
              password
            })
          }
        );


      /*
        Save the new account's session
        using the key expected by core.
      */
      if (data.token) {
        saveSession(data.token);
      }


      if (data.user) {

        localStorage.setItem(
          "ojoola_user",
          JSON.stringify(data.user)
        );
      }


      showMessage(
        "Account created successfully.",
        "success"
      );


      setTimeout(() => {

        window.location.replace(
          "index.html"
        );

      }, 350);

    } catch (error) {

      showMessage(
        error.message
      );

    } finally {

      button.disabled = false;
      button.textContent =
        "Create account";
    }
  }
);


/* =========================================================
   FORGOT PASSWORD
========================================================= */

forgotForm.addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    clearMessage();


    const mail =
      resetEmail.value.trim();


    if (!mail) {

      showMessage(
        "Enter your registered email address."
      );

      return;
    }


    const button =
      document.getElementById(
        "resetBtn"
      );


    button.disabled = true;
    button.textContent = "Sending...";


    try {

      await api(
        "/api/forgot-password",
        {
          method: "POST",

          body: JSON.stringify({
            email: mail
          })
        }
      );


      showMessage(
        "If an account exists for that email, a password-reset link has been sent.",
        "success"
      );

    } catch (error) {

      showMessage(
        error.message
      );

    } finally {

      button.disabled = false;
      button.textContent =
        "Send reset link";
    }
  }
);


/* =========================================================
   START ON SIGN IN
========================================================= */

showSignIn();

</script>
