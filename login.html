<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563EB">
<link rel="icon" href="icons/favicon.ico">
<title>Sign in – Ọjọ́ọ̀la</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--line:#dce3ee;--text:#172033;--muted:#64748b;--blue:#2563eb;--err:#b91c1c;--errbg:#fee2e2}
@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#121c2e;--line:#334155;--text:#e8edf7;--muted:#94a3b8;--err:#fecdd3;--errbg:#451c27}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:max(22px,env(safe-area-inset-top)) 20px max(22px,env(safe-area-inset-bottom))}
.box{width:100%;max-width:400px}
.brand{text-align:center;margin-bottom:22px}
.brand img{width:72px;height:72px;border-radius:22px}
.brand h1{margin:12px 0 4px;font-size:30px;letter-spacing:-.8px}
.brand p{margin:0;color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px}
.tabs{display:flex;gap:6px;background:var(--bg);border-radius:14px;padding:4px;margin-bottom:16px}
.tabs button{flex:1;border:0;background:none;color:var(--muted);padding:10px;border-radius:11px;font:inherit;font-weight:700;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--card);color:var(--blue);box-shadow:0 1px 4px rgba(0,0,0,.12)}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}
input{width:100%;border:1px solid var(--line);border-radius:13px;padding:12px 13px;background:var(--card);color:var(--text);font:inherit;outline:none}
input:focus-visible{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.18)}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.go{width:100%;margin-top:18px;border:0;border-radius:13px;background:var(--blue);color:#fff;padding:13px;font:inherit;font-weight:800;cursor:pointer}
.go:disabled{opacity:.6}
.msg{display:none;margin-top:14px;padding:10px 12px;border-radius:12px;background:var(--errbg);color:var(--err);font-size:13px;line-height:1.45}
.hidden{display:none!important}
</style>
</head>
<body>
<script>window.OJOOLA_NO_GATE=1;</script>
<script src="ojoola-core.js"></script>

<div class="box">
  <div class="brand">
    <img src="icons/icon-192.png" alt="">
    <h1>Ọjọ́ọ̀la</h1>
    <p>Your AI Study Partner</p>
  </div>

  <div class="card">
    <div class="tabs" role="tablist">
      <button role="tab" id="tabIn" aria-selected="true" onclick="show('in')">Sign in</button>
      <button role="tab" id="tabUp" aria-selected="false" onclick="show('up')">Create account</button>
    </div>

    <form id="formIn" onsubmit="return submitIn(event)">
      <label for="inId">Username or email</label>
      <input id="inId" autocomplete="username" autocapitalize="none" required>
      <label for="inPw">Password</label>
      <input id="inPw" type="password" autocomplete="current-password" required>
      <div id="passcodeRow" class="hidden">
        <label for="inCode">Tester passcode</label>
        <input id="inCode" autocomplete="off" autocapitalize="characters" placeholder="XXXX-XXXX-XXXX-XXXX-XXXX-XXXX">
        <div class="hint">The owner gave you this passcode personally.</div>
      </div>
      <button class="go" id="goIn">Sign in</button>
    </form>

    <form id="formUp" class="hidden" onsubmit="return submitUp(event)">
      <label for="upFirst">First name</label>
      <input id="upFirst" autocomplete="given-name" required>
      <label for="upUser">Username</label>
      <input id="upUser" autocomplete="username" autocapitalize="none" pattern="[A-Za-z0-9_]{3,20}" required>
      <div class="hint">3–20 letters, numbers or underscores.</div>
      <label for="upEmail">Email</label>
      <input id="upEmail" type="email" autocomplete="email" required>
      <label for="upPw">Password</label>
      <input id="upPw" type="password" autocomplete="new-password" minlength="8" required>
      <div class="hint">At least 8 characters.</div>
      <button class="go" id="goUp">Create account</button>
    </form>

    <div id="msg" class="msg" role="alert"></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const next=()=>{const n=new URLSearchParams(location.search).get("next")||"index.html";return /^[\w\-.]+\.html$/.test(n)?n:"index.html"};
if(OjoolaCore.token())location.replace(next());

function show(w){
  const up=w==="up";
  $("formIn").classList.toggle("hidden",up);
  $("formUp").classList.toggle("hidden",!up);
  $("tabIn").setAttribute("aria-selected",!up);
  $("tabUp").setAttribute("aria-selected",up);
  err("");
}
function err(t){const m=$("msg");m.textContent=t;m.style.display=t?"block":"none"}

async function call(path,body,btn,label){
  btn.disabled=true;btn.textContent="Please wait…";err("");
  try{
    const r=await fetch(OjoolaCore.api+path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    const d=await r.json().catch(()=>({}));
    if(!r.ok){err(d.error||"Something went wrong. Try again.");return null}
    return d;
  }catch(_){err("Can’t reach the server. Check your connection.");return null}
  finally{btn.disabled=false;btn.textContent=label}
}

async function submitIn(e){
  e.preventDefault();
  const d=await call("/api/login",{identifier:$("inId").value,password:$("inPw").value,passcode:$("inCode").value},$("goIn"),"Sign in");
  if(d&&d.token){OjoolaCore.setSession(d.token);location.replace(next())}
  else if($("msg").textContent.toLowerCase().includes("passcode"))$("passcodeRow").classList.remove("hidden");
  return false;
}
async function submitUp(e){
  e.preventDefault();
  const d=await call("/api/signup",{firstName:$("upFirst").value,username:$("upUser").value,email:$("upEmail").value,password:$("upPw").value},$("goUp"),"Create account");
  if(d&&d.token){OjoolaCore.setSession(d.token);location.replace(next())}
  return false;
}
</script>
</body>
</html>
