name = "ojoola"
main = "worker.js"
compatibility_date = "2025-01-01"

[vars]
ALLOWED_ORIGIN = "*"        # change to your app's https:// address once it works
DAILY_LIMIT = "150"         # AI requests per user per day (protects free Gemini quota)

[[d1_databases]]
binding = "DB"
database_name = "ojoola"
database_id = "PASTE_ID_FROM_wrangler_d1_create"
