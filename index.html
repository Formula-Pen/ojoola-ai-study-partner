<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102a56">
<meta name="description" content="Ọjọ́ọ̀la — Your AI Study Partner">
<link rel="manifest" href="manifest.json">
<title>Ọjọ́ọ̀la</title>

<style>
:root{
  --navy:#102a56;
  --blue:#2563eb;
  --bg:#f4f6fb;
  --surface:#fff;
  --text:#172033;
  --muted:#748094;
  --border:#e4e8f0;
  --ai:#f2f4f8;
  --danger:#dc3545;
}
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);color:var(--text);
}
body.dark{
  --bg:#101725;
  --surface:#192436;
  --text:#edf2fa;
  --muted:#a5b1c4;
  --border:#2b3a50;
  --ai:#202d41;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.hidden{display:none!important}
.app{min-height:100dvh}
.topbar{
  height:58px;background:var(--surface);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 15px;position:sticky;top:0;z-index:5;
}
.brand{font-weight:800;font-size:20px;color:var(--navy)}
.dark .brand{color:#8db5ff}
.iconbtn{
  border:0;background:transparent;color:var(--text);
  padding:9px;border-radius:10px;font-size:19px;
}
.iconbtn:active{background:var(--border)}
.main{
  max-width:850px;margin:auto;padding:16px;
  padding-bottom:90px;
}
.card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:15px;padding:15px;margin-bottom:13px;
}
h1,h2,h3{margin-top:0}
.muted{color:var(--muted);font-size:13px}
.primary{
  border:0;border-radius:11px;padding:12px 16px;
  color:white;background:var(--blue);font-weight:700;
}
.secondary{
  border:1px solid var(--border);border-radius:10px;
  padding:10px 13px;background:var(--surface);color:var(--text);
}
.danger{color:var(--danger)}
input,textarea,select{
  width:100%;padding:12px;border:1px solid var(--border);
  border-radius:10px;background:var(--surface);color:var(--text);
  outline:none;
}
textarea{resize:none}
input:focus,textarea:focus{border-color:var(--blue)}
.row{display:flex;gap:9px;align-items:center}
.row>*{min-width:0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.courseTile{
  padding:15px;border:1px solid var(--border);
  background:var(--surface);border-radius:13px;text-align:left;
  color:var(--text);min-height:90px;
}
.courseTile strong{display:block;margin-bottom:7px}
.nav{
  position:fixed;bottom:0;left:0;right:0;height:64px;
  display:flex;justify-content:space-around;align-items:center;
  background:var(--surface);border-top:1px solid var(--border);
  z-index:6;padding-bottom:env(safe-area-inset-bottom);
}
.nav button{
  border:0;background:none;color:var(--muted);
  padding:8px;font-size:12px;
}
.nav button.active{color:var(--blue);font-weight:bold}

/* CHAT LAYOUT */
.chatScreen{
  position:fixed;inset:0;z-index:20;
  height:100dvh;width:100%;
  display:flex;flex-direction:column;
  background:var(--bg);
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
}
.chatHeader{
  flex:0 0 54px;background:var(--surface);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:8px;
  padding:0 8px;
}
.chatTitle{
  flex:1;min-width:0;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.searchBar{
  flex:0 0 auto;padding:7px 10px;
  background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;gap:6px;align-items:center;
}
.searchBar input{padding:8px}
.chatArea{
  flex:1;min-height:0;overflow-y:auto;
  overscroll-behavior:contain;
  padding:12px 10px 18px;
  scroll-behavior:smooth;
}
.message{
  display:flex;width:100%;margin:0 0 15px;
}
.message.user{justify-content:flex-end}
.message.ai{justify-content:flex-start;display:block}
.bubble{
  border-radius:16px;padding:12px 14px;
  overflow-wrap:anywhere;line-height:1.65;
  user-select:text;-webkit-user-select:text;
}
.message.user .bubble{
  max-width:86%;background:#102a56;color:#fff;
  border-bottom-right-radius:4px;
}
.message.ai .bubble{
  width:100%;max-width:none;
  background:var(--ai);color:var(--text);
  border-radius:12px;padding:14px 12px;
}
.messageText{user-select:text;-webkit-user-select:text}
.messageText p{margin:0 0 10px}
.messageText p:last-child{margin-bottom:0}
.messageText h1,.messageText h2,.messageText h3{margin:15px 0 8px}
.messageText ul,.messageText ol{padding-left:23px}
.messageText pre{
  white-space:pre-wrap;overflow-wrap:anywhere;
  padding:12px;border-radius:9px;background:#111827;color:#e5e7eb;
  overflow-x:auto;
}
.messageText code{
  background:rgba(120,130,150,.18);
  padding:2px 4px;border-radius:4px;
}
.messageText pre code{background:none;padding:0}
.messageActions{
  display:flex;gap:13px;flex-wrap:wrap;
  margin-top:10px;font-size:12px;color:var(--muted);
}
.messageActions button{
  background:none;border:0;color:inherit;padding:3px 0;
}
.messageActions button:active{color:var(--blue)}
.chatComposer{
  flex:0 0 auto;background:var(--surface);
  border-top:1px solid var(--border);
  padding:9px 10px calc(10px + env(safe-area-inset-bottom));
}
.composerTools{display:flex;gap:8px;margin-bottom:7px}
.composerRow{display:flex;gap:8px;align-items:flex-end}
.composerRow textarea{
  min-height:45px;max-height:130px;
  flex:1;line-height:1.4;
}
.sendBtn{
  width:46px;height:45px;border:0;border-radius:12px;
  background:var(--blue);color:white;font-size:19px;
}
.downButton{
  position:absolute;right:15px;bottom:115px;z-index:3;
  width:42px;height:42px;border-radius:50%;
  background:var(--surface);border:1px solid var(--border);
  box-shadow:0 3px 12px #0002;font-size:20px;color:var(--text);
}
.typing{color:var(--muted);font-size:13px;padding:8px}
.fileChip{
  display:inline-flex;gap:7px;align-items:center;
  padding:7px 9px;border:1px solid var(--border);
  border-radius:8px;margin:4px;font-size:12px;
}
.modal{
  position:fixed;inset:0;z-index:40;
  background:#0008;display:flex;align-items:center;
  justify-content:center;padding:15px;
}
.modalBox{
  background:var(--surface);color:var(--text);
  width:100%;max-width:500px;max-height:85dvh;
  overflow:auto;border-radius:16px;padding:18px;
}
.modalHead{
  display:flex;justify-content:space-between;
  align-items:center;margin-bottom:15px;
}
.courseFile{
  display:flex;justify-content:space-between;
  gap:8px;align-items:center;padding:10px 0;
  border-bottom:1px solid var(--border);font-size:13px;
}
.errorPanel{
  position:fixed;z-index:100;bottom:10px;left:10px;right:10px;
  background:#7f1d1d;color:white;border-radius:12px;
  padding:13px;box-shadow:0 5px 20px #0005;
  max-height:45dvh;overflow:auto;font-size:12px;
}
.errorPanel pre{white-space:pre-wrap;overflow-wrap:anywhere}
@media(min-width:700px){
  .main{padding-top:25px}
  .chatArea{padding-left:24px;padding-right:24px}
  .chatComposer{padding-left:24px;padding-right:24px}
}
</style>
</head>

<body>
<div class="app" id="app">
  <header class="topbar" id="topbar">
    <div class="brand">Ọjọ́ọ̀la</div>
    <button class="iconbtn" onclick="openSettings()" aria-label="Settings">⚙</button>
  </header>

  <main class="main" id="homePage">
    <section class="card">
      <h2>Welcome to Ọjọ́ọ̀la</h2>
      <p class="muted">Your AI Study Partner. Learn from your course materials or ask general questions.</p>
      <button class="primary" onclick="openGeneral()">Start General Chat</button>
    </section>

    <section class="card">
      <div class="row" style="justify-content:space-between">
        <h3 style="margin:0">My Courses</h3>
        <button class="secondary" onclick="openCourseManager()">Manage</button>
      </div>
      <p class="muted">Choose a course to study with its uploaded materials.</p>
      <div class="grid" id="courseGrid"></div>
    </section>
  </main>

  <main class="main hidden" id="coursePage">
    <button class="secondary" onclick="goHome()">← Back</button>
    <section class="card" style="margin-top:12px">
      <h2 id="coursePageTitle"></h2>
      <p class="muted" id="courseDescription"></p>
      <div class="row">
        <button class="primary" onclick="openCourseChat()">Open Course Chat</button>
        <button class="secondary" onclick="toggleReference()">Reference: <span id="referenceState"></span></button>
      </div>
    </section>
    <section class="card">
      <h3>Course materials</h3>
      <input type="file" id="courseFilesInput" accept=".pdf,image/*" multiple>
      <p class="muted">Upload PDFs or images to use as reference materials.</p>
      <div id="courseFilesList"></div>
    </section>
  </main>

  <section class="chatScreen hidden" id="chatScreen">
    <header class="chatHeader">
      <button class="iconbtn" onclick="backFromChat()">←</button>
      <div class="chatTitle" id="chatTitle">General Chat</div>
      <button class="iconbtn" onclick="openSettings()">⚙</button>
    </header>

    <div class="searchBar">
      <input id="chatSearch" placeholder="Search this conversation..." oninput="searchMessages()">
      <button class="secondary" onclick="moveSearch(-1)">↑</button>
      <button class="secondary" onclick="moveSearch(1)">↓</button>
    </div>

    <div class="chatArea" id="chatArea" onscroll="updateDownButton()">
      <div id="messages"></div>
    </div>

    <button class="downButton hidden" id="downButton" onclick="scrollToBottom()">↓</button>

    <footer class="chatComposer">
      <div id="attachmentPreview"></div>
      <div class="composerTools">
        <button class="secondary" onclick="document.getElementById('chatFileInput').click()">＋ Attach</button>
        <button class="secondary" onclick="toggleCourseReferenceFromChat()" id="chatReferenceButton">Course reference</button>
        <input id="chatFileInput" type="file" accept=".pdf,image/*" multiple hidden>
      </div>
      <div class="composerRow">
        <textarea id="chatInput" rows="1" placeholder="Message Ọjọ́ọ̀la..." oninput="resizeInput(this)" onkeydown="handleEnter(event)"></textarea>
        <button class="sendBtn" id="sendButton" onclick="sendMessage()">➤</button>
        <button class="secondary hidden" id="stopButton" onclick="stopGeneration()">Stop</button>
      </div>
    </footer>
  </section>

  <nav class="nav" id="bottomNav">
    <button class="active" onclick="goHome()">⌂<br>Home</button>
    <button onclick="openGeneral()">✎<br>General</button>
    <button onclick="openCourseManager()">▤<br>Courses</button>
    <button onclick="openSettings()">⚙<br>Settings</button>
  </nav>
</div>

<div class="modal hidden" id="modal" onclick="modalBackdrop(event)">
  <div class="modalBox" id="modalBox"></div>
</div>

<div class="errorPanel hidden" id="errorPanel">
  <strong>Ọjọ́ọ̀la detected an error</strong>
  <pre id="errorDetails"></pre>
  <div class="row">
    <button class="secondary" onclick="copyError()">Copy error</button>
    <button class="secondary" onclick="hideError()">Dismiss</button>
  </div>
</div>

<script>
"use strict";

/* ---------------- APP DATA ---------------- */

const STORE_KEY = "ojooola_study_data_v4";
const SETTINGS_KEY = "ojooola_settings_v4";

const DEFAULT_COURSES = Array.from({length:15},(_,i)=>({
  id:"course_"+(i+301),
  code:"CSC "+(i+301),
  name:"Course "+(i+1),
  description:"",
  ref:true,
  files:[],
  chat:[]
}));

let courses = loadCourses();
let settings = loadSettings();
let currentMode = "general";
let currentCourseId = null;
let currentChat = [];
let currentFiles = [];
let controller = null;
let requestNumber = 0;
let searchMatches = [];
let searchIndex = -1;
let previousPage = "home";
let isGenerating = false;

const FAST_FALLBACK = [
  "gemini-3.8-flash",
  "gemini-3.7-flash",
  "gemini-3.6-flash",
  "gemini-3.5-flash-lite"
];

function loadCourses(){
  try{
    const saved = JSON.parse(localStorage.getItem(STORE_KEY));
    if(Array.isArray(saved) && saved.length) return saved;
  }catch(e){}
  return DEFAULT_COURSES;
}

function loadSettings(){
  try{
    return JSON.parse(localStorage.getItem(SETTINGS_KEY)) || {
      apiKey:"",dark:false
    };
  }catch(e){
    return {apiKey:"",dark:false};
  }
}

function saveCourses(){
  try{
    localStorage.setItem(STORE_KEY,JSON.stringify(courses));
    return true;
  }catch(error){
    showError("Could not save your course data. Your browser storage may be full. Remove some large files and try again.",error);
    return false;
  }
}

function saveSettings(){
  localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings));
}

function getCourse(){
  return courses.find(c=>c.id===currentCourseId);
}

function applyTheme(){
  document.body.classList.toggle("dark",!!settings.dark);
}

applyTheme();

/* ---------------- PAGE NAVIGATION ---------------- */

function hideAllPages(){
  ["homePage","coursePage","chatScreen"].forEach(id=>{
    document.getElementById(id).classList.add("hidden");
  });
}

function goHome(push=true){
  if(push) history.pushState({page:"home"},"","#home");
  hideAllPages();
  document.getElementById("homePage").classList.remove("hidden");
  document.getElementById("topbar").classList.remove("hidden");
  document.getElementById("bottomNav").classList.remove("hidden");
  currentMode="general";
  renderCourses();
}

function openGeneral(push=true){
  if(push) history.pushState({page:"general"},"","#general");
  previousPage="home";
  currentMode="general";
  currentCourseId=null;
  currentChat = getGeneralChat();
  showChat("General Chat");
}

function getGeneralChat(){
  try{
    return JSON.parse(localStorage.getItem("ojooola_general_chat")) || [];
  }catch(e){return []}
}

function saveGeneralChat(){
  try{
    localStorage.setItem("ojooola_general_chat",JSON.stringify(currentChat));
  }catch(e){
    showError("Your conversation could not be saved. Browser storage may be full.");
  }
}

function openCoursePage(id,push=true){
  const course=courses.find(c=>c.id===id);
  if(!course)return;
  if(push) history.pushState({page:"course",id},"","#"+id);
  previousPage="home";
  currentCourseId=id;
  hideAllPages();
  document.getElementById("topbar").classList.remove("hidden");
  document.getElementById("bottomNav").classList.remove("hidden");
  document.getElementById("coursePage").classList.remove("hidden");
  document.getElementById("coursePageTitle").textContent=course.code+" — "+course.name;
  document.getElementById("courseDescription").textContent=course.description||"Your course workspace.";
  document.getElementById("referenceState").textContent=course.ref?"ON":"OFF";
  renderCourseFiles();
}

function openCourseChat(push=true){
  const course=getCourse();
  if(!course)return;
  if(push) history.pushState({page:"chat",id:course.id},"","#chat-"+course.id);
  currentMode="course";
  currentChat=course.chat||[];
  showChat(course.code+" — "+course.name);
}

function showChat(title){
  hideAllPages();
  document.getElementById("topbar").classList.add("hidden");
  document.getElementById("bottomNav").classList.add("hidden");
  document.getElementById("chatScreen").classList.remove("hidden");
  document.getElementById("chatTitle").textContent=title;
  document.getElementById("chatReferenceButton").classList.toggle("hidden",currentMode!=="course");
  document.getElementById("chatInput").value="";
  renderMessages();
  requestAnimationFrame(()=>requestAnimationFrame(scrollToBottom));
}

function backFromChat(){
  if(currentMode==="course"){
    openCoursePage(currentCourseId);
  }else{
    goHome();
  }
}

window.addEventListener("popstate",event=>{
  const state=event.state;
  if(!state || state.page==="home")goHome(false);
  else if(state.page==="general")openGeneral(false);
  else if(state.page==="course")openCoursePage(state.id,false);
  else if(state.page==="chat"){
    currentCourseId=state.id;
    currentMode="course";
    currentChat=getCourse()?.chat||[];
    showChat(getCourse()?.code||"Course Chat");
  }
});

/* ---------------- COURSE MANAGER ---------------- */

function renderCourses(){
  const grid=document.getElementById("courseGrid");
  grid.innerHTML="";
  courses.forEach(course=>{
    const button=document.createElement("button");
    button.className="courseTile";
    button.innerHTML="<strong></strong><span class='muted'></span>";
    button.querySelector("strong").textContent=course.code;
    button.querySelector("span").textContent=course.name;
    button.onclick=()=>openCoursePage(course.id);
    grid.appendChild(button);
  });
}

function openCourseManager(){
  let html=`<div class="modalHead"><h3>Manage courses</h3><button class="iconbtn" onclick="closeModal()">✕</button></div>`;
  courses.forEach((c,i)=>{
    html+=`
      <div class="card">
        <label class="muted">Course code</label>
        <input id="code_${i}" value="${escapeAttr(c.code)}">
        <label class="muted">Course name</label>
        <input id="name_${i}" value="${escapeAttr(c.name)}" style="margin-top:7px">
      </div>`;
  });
  html+=`<button class="primary" onclick="saveCourseNames()">Save courses</button>`;
  openModal(html);
}

function saveCourseNames(){
  courses.forEach((c,i)=>{
    c.code=document.getElementById("code_"+i).value.trim()||c.code;
    c.name=document.getElementById("name_"+i).value.trim()||c.name;
  });
  saveCourses();
  closeModal();
  renderCourses();
}

function toggleReference(){
  const c=getCourse();if(!c)return;
  c.ref=!c.ref;saveCourses();
  document.getElementById("referenceState").textContent=c.ref?"ON":"OFF";
}

function toggleCourseReferenceFromChat(){
  const c=getCourse();if(!c)return;
  c.ref=!c.ref;saveCourses();
  document.getElementById("chatReferenceButton").textContent="Course reference: "+(c.ref?"ON":"OFF");
}

/* ---------------- COURSE FILES ---------------- */

document.getElementById("courseFilesInput").addEventListener("change",async event=>{
  const files=[...event.target.files];
  const c=getCourse();if(!c)return;
  for(const file of files){
    if(!file.type.startsWith("image/") && file.type!=="application/pdf"){
      alert("Only PDF and image files are supported.");continue;
    }
    try{
      const data=await readFile(file);
      c.files.push({
        id:crypto.randomUUID(),
        name:file.name,
        size:file.size,
        mimeType:file.type,
        data
      });
    }catch(e){showError("Could not read "+file.name,e);}
  }
  saveCourses();renderCourseFiles();event.target.value="";
});

function readFile(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result);
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

function renderCourseFiles(){
  const c=getCourse();if(!c)return;
  const box=document.getElementById("courseFilesList");
  box.innerHTML="";
  if(!c.files?.length){
    box.innerHTML="<p class='muted'>No materials uploaded yet.</p>";return;
  }
  c.files.forEach(file=>{
    const row=document.createElement("div");
    row.className="courseFile";
    const name=document.createElement("span");
    name.textContent=file.name;
    const remove=document.createElement("button");
    remove.className="secondary danger";
    remove.textContent="Delete";
    remove.onclick=()=>{
      c.files=c.files.filter(f=>f.id!==file.id);
      saveCourses();renderCourseFiles();
    };
    row.append(name,remove);box.appendChild(row);
  });
}

/* ---------------- CHAT ATTACHMENTS ---------------- */

document.getElementById("chatFileInput").addEventListener("change",async event=>{
  for(const file of [...event.target.files]){
    if(!file.type.startsWith("image/") && file.type!=="application/pdf"){
      alert("Only PDF and image files are supported.");continue;
    }
    try{
      currentFiles.push({
        id:crypto.randomUUID(),name:file.name,
        mimeType:file.type,data:await readFile(file)
      });
    }catch(e){showError("Could not read "+file.name,e);}
  }
  renderAttachmentPreview();event.target.value="";
});

function renderAttachmentPreview(){
  const box=document.getElementById("attachmentPreview");
  box.innerHTML="";
  currentFiles.forEach(file=>{
    const chip=document.createElement("span");
    chip.className="fileChip";
    chip.textContent=file.name;
    const remove=document.createElement("button");
    remove.textContent="×";
    remove.onclick=()=>{
      currentFiles=currentFiles.filter(f=>f.id!==file.id);
      renderAttachmentPreview();
    };
    chip.appendChild(remove);box.appendChild(chip);
  });
}

/* ---------------- MESSAGE RENDERING ---------------- */

function escapeHTML(text){
  return String(text).replace(/[&<>"']/g,char=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[char]);
}

function escapeAttr(text){return escapeHTML(text)}

function markdown(text){
  let safe=escapeHTML(text||"");
  const blocks=[];
  safe=safe.replace(/```([\s\S]*?)```/g,(match,code)=>{
    blocks.push("<pre><code>"+code.trim()+"</code></pre>");
    return "%%CODE"+(blocks.length-1)+"%%";
  });
  safe=safe.replace(/`([^`]+)`/g,"<code>$1</code>");
  safe=safe.replace(/^### (.+)$/gm,"<h3>$1</h3>");
  safe=safe.replace(/^## (.+)$/gm,"<h2>$1</h2>");
  safe=safe.replace(/^# (.+)$/gm,"<h1>$1</h1>");
  safe=safe.replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>");
  safe=safe.replace(/\*(.*?)\*/g,"<em>$1</em>");
  safe=safe.replace(/^\s*[-*] (.+)$/gm,"<li>$1</li>");
  safe=safe.replace(/(<li>.*<\/li>)/gs,"<ul>$1</ul>");
  safe=safe.replace(/\n/g,"<br>");
  safe=safe.replace(/%%CODE(\d+)%%/g,(m,i)=>blocks[Number(i)]);
  return safe;
}

function renderMessages(){
  const box=document.getElementById("messages");
  box.innerHTML="";
  if(!currentChat.length){
    box.innerHTML=`<div class="card" style="text-align:center;margin-top:25px">
      <h3>Start a conversation</h3>
      <p class="muted">Ask a question, discuss a topic or study your uploaded materials.</p>
    </div>`;
    return;
  }
  currentChat.forEach((msg,index)=>{
    const item=document.createElement("div");
    item.className="message "+(msg.role==="user"?"user":"ai");
    item.dataset.index=index;
    const bubble=document.createElement("div");
    bubble.className="bubble";
    const content=document.createElement("div");
    content.className="messageText";
    content.innerHTML=markdown(msg.text||"");
    bubble.appendChild(content);

    if(msg.role!=="user"){
      const actions=document.createElement("div");
      actions.className="messageActions";
      actions.innerHTML=`
        <button onclick="copyMessage(${index})">Copy</button>
        <button onclick="shareMessage(${index})">Share</button>
        <button onclick="speakMessage(${index})">Read aloud</button>`;
      bubble.appendChild(actions);
    }
    item.appendChild(bubble);box.appendChild(item);
  });
}

function persistChat(){
  if(currentMode==="general")saveGeneralChat();
  else{
    const c=getCourse();
    if(c){c.chat=currentChat;saveCourses();}
  }
}

function copyMessage(index){
  navigator.clipboard.writeText(currentChat[index]?.text||"")
    .then(()=>toast("Copied"));
}

async function shareMessage(index){
  const text=currentChat[index]?.text||"";
  if(navigator.share){
    try{await navigator.share({title:"Ọjọ́ọ̀la",text});}catch(e){}
  }else{
    await navigator.clipboard.writeText(text);toast("Copied for sharing");
  }
}

function speakMessage(index){
  const text=currentChat[index]?.text||"";
  if(!("speechSynthesis" in window)){toast("Read aloud is not supported");return;}
  speechSynthesis.cancel();
  speechSynthesis.speak(new SpeechSynthesisUtterance(text));
}

/* ---------------- MESSAGE SEARCH ---------------- */

function searchMessages(){
  const query=document.getElementById("chatSearch").value.toLowerCase();
  searchMatches=[];
  searchIndex=-1;
  if(!query)return;
  currentChat.forEach((msg,i)=>{
    if((msg.text||"").toLowerCase().includes(query))searchMatches.push(i);
  });
  if(searchMatches.length){searchIndex=0;highlightSearch();}
}

function moveSearch(direction){
  if(!searchMatches.length)return;
  searchIndex=(searchIndex+direction+searchMatches.length)%searchMatches.length;
  highlightSearch();
}

function highlightSearch(){
  document.querySelectorAll(".message").forEach(el=>el.style.outline="none");
  const el=document.querySelector(`[data-index="${searchMatches[searchIndex]}"]`);
  if(el){
    el.style.outline="2px solid var(--blue)";
    el.scrollIntoView({behavior:"smooth",block:"center"});
  }
}

/* ---------------- SCROLLING ---------------- */

function scrollToBottom(){
  const area=document.getElementById("chatArea");
  area.scrollTo({top:area.scrollHeight,behavior:"smooth"});
  document.getElementById("downButton").classList.add("hidden");
}

function nearBottom(){
  const area=document.getElementById("chatArea");
  return area.scrollHeight-area.scrollTop-area.clientHeight<130;
}

function updateDownButton(){
  document.getElementById("downButton").classList.toggle("hidden",nearBottom());
}

function appendMessage(message){
  const shouldFollow=nearBottom();
  currentChat.push(message);
  persistChat();renderMessages();
  if(shouldFollow)requestAnimationFrame(scrollToBottom);
}

/* ---------------- SEND AND GEMINI ---------------- */

function resizeInput(element){
  element.style.height="auto";
  element.style.height=Math.min(element.scrollHeight,130)+"px";
}

function handleEnter(event){
  if(event.key==="Enter"&&!event.shiftKey){
    event.preventDefault();sendMessage();
  }
}

function buildCourseContext(course){
  if(!course)return "";
  let context=`Course: ${course.code} — ${course.name}\n`;
  if(course.description)context+=`Description: ${course.description}\n`;
  if(course.ref){
    context+="Use the attached course materials as the primary source. If the materials do not contain an answer, clearly say so rather than pretending the information came from them.\n";
    context+="Uploaded files: "+(course.files||[]).map(f=>f.name).join(", ");
  }else{
    context+="The user has disabled course reference materials. Answer normally.";
  }
  return context;
}

function dataUrlParts(file){
  if(!file?.data)return null;
  const match=file.data.match(/^data:([^;]+);base64,(.+)$/);
  if(!match)return null;
  return {
    inline_data:{
      mime_type:file.mimeType||match[1],
      data:match[2]
    }
  };
}

function collectAttachments(){
  const result=[];
  if(currentMode==="course"){
    const course=getCourse();
    if(course?.ref){
      (course.files||[]).forEach(file=>{
        const part=dataUrlParts(file);
        if(part)result.push(part);
      });
    }
  }
  currentFiles.forEach(file=>{
    const part=dataUrlParts(file);
    if(part)result.push(part);
  });
  const total=result.reduce((sum,part)=>sum+part.inline_data.data.length,0);
  if(total>15*1024*1024){
    throw new Error("The selected files are too large to send together. Try fewer or smaller files.");
  }
  return result;
}

async function sendMessage(){
  if(isGenerating)return;
  const input=document.getElementById("chatInput");
  const prompt=input.value.trim();
  if(!prompt&&!currentFiles.length)return;

  if(!settings.apiKey){
    openSettings();
    toast("Add your Gemini API key first.");
    return;
  }

  let attachments;
  try{attachments=collectAttachments();}
  catch(error){showError(error.message,error);return;}

  const priorHistory=currentChat.slice();
  const filesUsed=currentFiles.map(f=>f.name);
  const fullPrompt=prompt+(filesUsed.length?
    "\n\nAttached files: "+filesUsed.join(", "):"");

  currentFiles=[];
  renderAttachmentPreview();
  input.value="";input.style.height="45px";

  appendMessage({role:"user",text:fullPrompt});
  const answerIndex=currentChat.length;
  currentChat.push({role:"model",text:""});
  persistChat();renderMessages();

  const runId=++requestNumber;
  isGenerating=true;
  controller=new AbortController();
  document.getElementById("sendButton").classList.add("hidden");
  document.getElementById("stopButton").classList.remove("hidden");

  const typing=document.createElement("div");
  typing.className="typing";
  typing.id="typingIndicator";
  typing.textContent="Ọjọ́ọ̀la is thinking...";
  document.getElementById("messages").appendChild(typing);
  scrollToBottom();

  try{
    let answer="";
    const course=getCourse();
    const context=currentMode==="course"?buildCourseContext(course):"You are Ọjọ́ọ̀la, a helpful AI study partner. Explain clearly and structure answers for easy reading.";
    const history=priorHistory.slice(-20).map(m=>({
      role:m.role==="user"?"user":"model",
      parts:[{text:m.text||""}]
    }));

    answer=await callGemini(fullPrompt,history,context,attachments,controller.signal,runId);
    if(runId!==requestNumber)return;
    currentChat[answerIndex].text=answer||"I couldn't produce a response. Please try again.";
    persistChat();
  }catch(error){
    if(runId!==requestNumber)return;
    if(error.name==="AbortError"){
      if(!currentChat[answerIndex].text)currentChat[answerIndex].text="Generation stopped.";
    }else{
      currentChat[answerIndex].text="I couldn't complete that response.\n\n"+error.message;
    }
    persistChat();
  }finally{
    if(runId===requestNumber){
      isGenerating=false;
      controller=null;
      document.getElementById("typingIndicator")?.remove();
      document.getElementById("sendButton").classList.remove("hidden");
      document.getElementById("stopButton").classList.add("hidden");
      renderMessages();
      scrollToBottom();
    }
  }
}

async function callGemini(prompt,history,context,attachments,signal,runId){
  let lastError=null;
  for(const model of FAST_FALLBACK){
    if(signal.aborted)throw new DOMException("Stopped","AbortError");
    try{
      return await callGeminiModel(model,prompt,history,context,attachments,signal);
    }catch(error){
      if(error.name==="AbortError")throw error;
      lastError=error;
      if(error.status===400||error.status===401||error.status===403)throw error;
    }
  }
  throw lastError||new Error("All available models failed.");
}

async function callGeminiModel(model,prompt,history,context,attachments,signal){
  const contents=[...history];
  const parts=[{text:context+"\n\nUser question:\n"+prompt},...attachments];
  contents.push({role:"user",parts});

  const endpoint=`https://generativelanguage.googleapis.com/v1beta/models/${model}:streamGenerateContent?alt=sse`;

  const timeoutController=new AbortController();
  const timeout=setTimeout(()=>timeoutController.abort(),45000);
  const combined=new AbortController();
  const abort=()=>combined.abort();
  signal.addEventListener("abort",abort,{once:true});
  timeoutController.signal.addEventListener("abort",abort,{once:true});

  try{
    const response=await fetch(endpoint,{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "x-goog-api-key":settings.apiKey
      },
      body:JSON.stringify({
        contents,
        generationConfig:{
          temperature:0.7,
          maxOutputTokens:8192
        }
      }),
      signal:combined.signal
    });

    if(!response.ok){
      const body=await response.text();
      let detail=body;
      try{
        const parsed=JSON.parse(body);
        detail=parsed.error?.message||body;
      }catch(e){}
      const error=new Error(`Gemini API error (${response.status}): ${detail}`);
      error.status=response.status;
      throw error;
    }

    if(!response.body)throw new Error("Streaming response was not available.");

    const reader=response.body.getReader();
    const decoder=new TextDecoder();
    let buffer="",answer="";

    while(true){
      const {value,done}=await reader.read();
      if(done)break;
      buffer+=decoder.decode(value,{stream:true});
      const events=buffer.split("\n\n");
      buffer=events.pop()||"";

      for(const event of events){
        const line=event.split("\n").find(x=>x.startsWith("data:"));
        if(!line)continue;
        const raw=line.slice(5).trim();
        if(!raw||raw==="[DONE]")continue;
        try{
          const data=JSON.parse(raw);
          const textPart=data.candidates?.[0]?.content?.parts
            ?.map(p=>p.text||"").join("")||"";
          if(textPart){
            answer+=textPart;
            updateStreamingAnswer(answer);
          }
        }catch(e){}
      }
    }

    buffer+=decoder.decode();
    if(buffer.trim().startsWith("data:")){
      try{
        const data=JSON.parse(buffer.trim().slice(5).trim());
        answer+=data.candidates?.[0]?.content?.parts?.map(p=>p.text||"").join("")||"";
      }catch(e){}
    }

    if(!answer.trim())throw new Error("The AI returned an empty response.");
    return answer;
  }finally{
    clearTimeout(timeout);
    signal.removeEventListener("abort",abort);
  }
}

function updateStreamingAnswer(text){
  const last=currentChat[currentChat.length-1];
  if(last&&last.role==="model"){
    last.text=text;
    const shouldFollow=nearBottom();
    renderMessages();
    if(shouldFollow)scrollToBottom();
  }
}

function stopGeneration(){
  if(controller)controller.abort();
}

/* ---------------- SETTINGS ---------------- */

function openSettings(){
  const html=`
    <div class="modalHead">
      <h3>Ọjọ́ọ̀la settings</h3>
      <button class="iconbtn" onclick="closeModal()">✕</button>
    </div>
    <label>Gemini API key</label>
    <input id="apiKeyInput" type="password" placeholder="Enter your API key" value="${escapeAttr(settings.apiKey)}">
    <p class="muted">Your key is saved in this browser's local storage. Do not share it with anyone.</p>
    <div class="row" style="margin-top:12px">
      <button class="primary" onclick="saveSettingsFromModal()">Save settings</button>
      <button class="secondary" onclick="toggleTheme()">Toggle dark mode</button>
    </div>
    <hr style="border-color:var(--border);margin:18px 0">
    <button class="secondary" onclick="installApp()">Install Ọjọ́ọ̀la</button>
    <button class="secondary" onclick="checkForUpdates()">Check for updates</button>
    <button class="secondary danger" onclick="clearChats()">Clear conversations</button>
    <p class="muted">Clearing conversations does not delete your courses or uploaded materials.</p>`;
  openModal(html);
}

function saveSettingsFromModal(){
  settings.apiKey=document.getElementById("apiKeyInput").value.trim();
  saveSettings();closeModal();toast("Settings saved");
}

function toggleTheme(){
  settings.dark=!settings.dark;
  saveSettings();applyTheme();
  if(!document.getElementById("modal").classList.contains("hidden"))openSettings();
}

function clearChats(){
  if(!confirm("Clear all General and Course conversations? Your uploaded course materials will remain."))return;
  localStorage.removeItem("ojooola_general_chat");
  courses.forEach(c=>c.chat=[]);
  saveCourses();currentChat=[];
  closeModal();renderMessages();toast("Conversations cleared");
}

/* ---------------- MODALS AND UTILITIES ---------------- */

function openModal(html){
  document.getElementById("modalBox").innerHTML=html;
  document.getElementById("modal").classList.remove("hidden");
}
function closeModal(){
  document.getElementById("modal").classList.add("hidden");
}
function modalBackdrop(event){
  if(event.target.id==="modal")closeModal();
}
function toast(message){
  const el=document.createElement("div");
  el.textContent=message;
  el.style.cssText="position:fixed;z-index:90;bottom:85px;left:50%;transform:translateX(-50%);background:#172033;color:white;padding:11px 16px;border-radius:20px;font-size:13px";
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),2200);
}

/* ---------------- ERROR DIAGNOSTICS ---------------- */

function showError(message,error){
  const panel=document.getElementById("errorPanel");
  const details=[
    "Message: "+message,
    error?.stack||"",
    "Page: "+location.href,
    "Time: "+new Date().toISOString()
  ].filter(Boolean).join("\n\n");
  document.getElementById("errorDetails").textContent=details;
  panel.classList.remove("hidden");
}

window.addEventListener("error",event=>{
  showError(event.message||"Unknown JavaScript error",{
    stack:`File: ${event.filename}\nLine: ${event.lineno}\nColumn: ${event.colno}`
  });
});

window.addEventListener("unhandledrejection",event=>{
  const reason=event.reason;
  showError(reason?.message||String(reason),reason);
});

function copyError(){
  navigator.clipboard.writeText(document.getElementById("errorDetails").textContent)
    .then(()=>toast("Error details copied"));
}
function hideError(){
  document.getElementById("errorPanel").classList.add("hidden");
}

/* ---------------- PWA INSTALL AND UPDATES ---------------- */

let installPrompt=null;

window.addEventListener("beforeinstallprompt",event=>{
  event.preventDefault();installPrompt=event;
});

async function installApp(){
  if(!installPrompt){
    toast("Use your browser menu and choose Add to Home screen.");
    return;
  }
  installPrompt.prompt();
  await installPrompt.userChoice;
  installPrompt=null;
}

async function checkForUpdates(){
  if(!("serviceWorker" in navigator)){
    toast("Service workers are not supported.");return;
  }
  try{
    const registration=await navigator.serviceWorker.getRegistration();
    if(registration){
      await registration.update();
      toast("Update check completed.");
    }else{
      toast("App service worker is not registered yet.");
    }
  }catch(error){showError("Could not check for updates.",error);}
}

if("serviceWorker" in navigator){
  window.addEventListener("load",async()=>{
    try{
      const registration=await navigator.serviceWorker.register("./service-worker.js");
      registration.update();
    }catch(error){
      showError("Service worker registration failed.",error);
    }
  });
}

/* ---------------- STARTUP ---------------- */

renderCourses();
goHome(false);
</script>
